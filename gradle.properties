# Gradle daemon 堆：编译 Compose + KSP/Room(全量 classpath) 需要较大堆与 metaspace。
# 注意：本机 16GB 内存 + Windows 页面文件偏小，4GB 守护堆会触发「页面文件太小」(errno=1455) 无法启动。
# 已降到 2GB（足够编译本单 module 工程，且给 AS 与系统留足余量）；若改回请先调大系统虚拟内存。
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.caching=true
org.gradle.parallel=true
# 使用默认 Kotlin daemon（独立进程、隔离性好），不再强制 in-process，
# 避免守护进程内状态共享可能带来的诡异解析/幻影错误。
# Kotlin daemon 堆同步下调（原 3GB 与本机内存/页面文件不匹配），避免与 Gradle daemon 叠加提交超限。
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=1024m
# 关闭 KSP 增量处理：KSP 2.0.x 增量在个别场景下会吐出幻影语法错误，
# 关闭后首轮全量处理更稳（代价是 KSP 阶段稍慢，可接受）。
ksp.incremental=false
# 指定 Gradle/编译用的 JDK：本机无独立 JDK、未设 JAVA_HOME，
# 直接用 Android Studio 自带 JBR（JDK 25.0.2），让 ./gradlew 在任意终端都能跑。
# v7.2.0：Android Studio 随 D:\code 目录重排迁移到 D:\code\app\Studio\jbr，路径同步更新。
# 用正斜杠避免 .properties 反斜杠转义问题。
org.gradle.java.home=D:/code/app/Studio/jbr

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
